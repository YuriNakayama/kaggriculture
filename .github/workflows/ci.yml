name: CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "dev/**"
      - ".github/workflows/ci.yml"
    types:
      - opened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "dev/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Cache ruff / mypy / pytest
        uses: actions/cache@v4
        with:
          path: |
            backend/.mypy_cache
            backend/.ruff_cache
          key: ${{ runner.os }}-tools-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-tools-

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev
        working-directory: backend

      - name: Ruff format check
        run: uv run ruff format --check .
        working-directory: backend

      - name: Ruff lint
        run: uv run ruff check --output-format=github .
        working-directory: backend

      - name: MyPy type check
        run: uv run mypy --config-file pyproject.toml .
        working-directory: backend

      # The e2e slice runs full 720-turn seasons and packs submission archives.
      # It is fast here (~5s) and guards the two failures that cost a real
      # submission slot, so it runs in CI rather than being excluded.
      - name: Pytest
        run: uv run pytest tests -m "not slow" -n auto --no-cov
        working-directory: backend
