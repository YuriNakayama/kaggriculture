# AWS Amplify build spec for the playable frontend (monorepo app under frontend/).
# Static output only: frontend/playable/dist (includes the replay visualizer at
# /replay/ and the collected Python agent cases at /agents/).
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@10
            - pnpm install --frozen-lockfile
        build:
          commands:
            - node scripts/collect-agents.mjs
            - pnpm build
      artifacts:
        baseDirectory: playable/dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
