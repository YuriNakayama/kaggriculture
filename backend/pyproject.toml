[project]
name = "kaggriculture"
version = "0.1.0"
description = "Agents for the Kaggle Kaggriculture farming-sim competition"
readme = "../README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Yuri Nakayama" }]
dependencies = [
    "kaggle>=1.6",
    "kaggle-environments==1.32.6",
    "numpy>=2.0",
    "polars>=1.0",
    "pyarrow>=17.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "typer>=0.12",
    "dvc[s3]>=3.50",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
]
# GPU providers. Not needed for the rulebase family; install with
#   uv sync --group gpu
gpu = ["runpod>=1.7"]
nn = [
    "torch>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Each src/ subdirectory is exposed as a top-level package, so dev tooling
# imports are bare: `from simulate import ...`, `from submit import ...`.
packages = [
    "src/dataset",
    "src/gpu",
    "src/simulate",
    "src/submit",
]

[tool.ruff]
exclude = [
    ".git",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "__pypackages__",
    "build",
    "dist",
    "site-packages",
    "venv",
    ".claude",
    # Other competitors' public notebooks, kept verbatim for analysis. Not our
    # code — linting or reformatting them would destroy the reference.
    "notebook",
    # case3 is a verbatim port of one of those notebooks, kept byte-comparable
    # to its source so a future upstream revision can be diffed against it.
    # Reformatting it would destroy that property. Every other case, including
    # the lightly-adapted ports (case4-case6), is linted normally.
    "pipeline/rulebase/case3",
]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# typer's API *requires* typer.Option()/Argument() calls in argument defaults;
# B008 ("no function call in default") does not apply to CLI entrypoints.
"**/__main__.py" = ["B008"]
"**/cli/app.py" = ["B008"]
# These modules embed generated notebook / shell source as string literals.
# Rewrapping a line here changes the code that actually runs on the pod, so
# the line-length rule is waived rather than "fixed".
"**/interactive/template.py" = ["E501"]
"**/kernel/template.py" = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.isort]
case-sensitive = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
# Cases are exec'd flat by the Kaggle harness, so their modules import each
# other by bare name. Two cases both defining `config` cannot share one mypy
# run, so `dev/lint` type-checks each case in a separate pass with its own
# directory on MYPYPATH; this default pass skips them all.
mypy_path = "src"
explicit_package_bases = true
exclude = [
    ".venv",
    ".github",
    ".claude",
    "__pycache__",
    "notebook",
    # Checked individually by dev/lint, or exempt as verbatim notebook ports.
    # case3-case6 are upstream code kept byte-comparable to their source so a
    # future upstream revision can be diffed against them; annotating them would
    # fork them permanently for no behavioural gain. Their correctness is pinned
    # by e2e episodes and by explicit constant and price checks against the
    # engine instead.
    "pipeline/rulebase/",
]
python_version = "3.13"
strict = true
disallow_any_decorated = false
disallow_any_unimported = false
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
strict_optional = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = [
    '--rootdir=tests',
    '--strict-config',
    '--cov=src',
    '--log-cli-level=INFO',
    '-p no:cacheprovider',
    '-n=auto',
    '--dist=worksteal',
    '-ra',
]
testpaths = ['tests']
cache_dir = "tests/.pytest_cache"
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow (full seasons, training runs)",
    "e2e: marks tests as end-to-end self-play or full-episode tests",
    "timeout: marks tests with an execution timeout",
]

[tool.coverage.run]
branch = true
omit = ["**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING",
    "if __name__ == .__main__.",
]
